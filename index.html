
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Leitor Inteligente</title>
  <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
  <header>
    <h1>Leitor Inteligente de QR Code</h1>
  </header>
  <main class="container">
    <section class="conteudo-container">
      <p>Use sua câmera ou envie uma imagem com QR Code de cobrança ou link.</p>
      <button id="abrirCamera">📷 Abrir câmera</button>
      <input type="file" id="fileInput" accept="image/*">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <p id="result"></p>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 QR Leitor App</p>
    <p>Desenvolvido por Diogo Amorim</p>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
